app = "skillmcp"
primary_region = "sjc"

[build]

[env]
  SKILLMCP_CATALOG_URL = "https://raw.githubusercontent.com/derandomized/skillmcp/main/catalog/index.json"
  SKILLMCP_RAW_BASE = "https://raw.githubusercontent.com/derandomized/skillmcp/main"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"

[mounts]
  source = "skillmcp_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
