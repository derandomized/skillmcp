<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SkillMCP</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --line: #e5e7eb; --card: #f9fafb;
    --accent: #2563eb; --accent-fg: #fff; --chip: #eef2ff; --chip-fg: #3730a3; --code: #f3f4f6;
  }
  [data-theme="dark"] {
    --bg: #0f1115; --fg: #e5e7eb; --muted: #9ca3af; --line: #262a33; --card: #161a22;
    --accent: #60a5fa; --accent-fg: #0b1220; --chip: #1e2440; --chip-fg: #c7d2fe; --code: #1b1f29;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--fg); background: var(--bg); }
  .wrap { padding: 14px; max-width: 820px; }
  header { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header .n { color: var(--muted); font-size: 12px; }
  .search { display: flex; gap: 8px; margin-bottom: 12px; }
  input { flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
  select { padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .card { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 12px; cursor: pointer; transition: border-color .12s; }
  .card:hover { border-color: var(--accent); }
  .card h3 { margin: 0 0 4px; font-size: 14px; }
  .card p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
  .chip { display: inline-block; background: var(--chip); color: var(--chip-fg); border-radius: 999px; padding: 1px 8px; font-size: 11px; margin-right: 4px; }
  .detail { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--card); }
  .detail h2 { margin: 0 0 2px; font-size: 16px; }
  .detail .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  button { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button.link { border: none; background: none; color: var(--accent); padding: 0; }
  pre { background: var(--code); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 12.5px; white-space: pre-wrap; }
  .steps li { margin: 4px 0; }
  .steps code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
  .md { max-height: 320px; overflow: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SkillMCP</h1>
    <span class="n" id="count"></span>
  </header>
  <div id="view"></div>
</div>
<script type="module">
/*__APP_JS__*/
</script>
</body>
</html>
